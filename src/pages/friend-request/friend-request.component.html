<div class="container friend-request-page">

  <h1 class="page-title mb-4">Friend Requests</h1>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger text-center">
    {{ error }}
  </div>

  <div *ngIf="!loading && friendRequests.length === 0"
       class="alert alert-info text-center">

    You have no friend requests at the moment.

  </div>

  <div class="row g-4"
       *ngIf="!loading && friendRequests.length > 0">

    <div class="col-12 col-md-6 col-lg-4"
         *ngFor="let request of friendRequests">

      <article class="request-card card h-100">

        <div class="image-wrapper">

          <img
            [src]="request.fromUserId?.image || 'https://via.placeholder.com/300'"
            class="card-img-top"
          />

        </div>

        <div class="card-body">

          <h5 class="card-title">

            {{ request.fromUserId?.firstName }}
            {{ request.fromUserId?.lastName }}

          </h5>

          <p class="user-meta">

            <span *ngIf="request.fromUserId?.age">
              🎂 {{ request.fromUserId.age }}
            </span>

            <span *ngIf="request.fromUserId?.gender">
              👤 {{ request.fromUserId.gender }}
            </span>

          </p>

          <p class="user-about">

            {{ request.fromUserId?.about }}

          </p>

        </div>

        <div class="card-footer action-buttons">

          <button class="btn btn-success accept-btn" (click)="reviewFriendRequest('accepted', request._id)">

            ✔ Accept

          </button>


          <button class="btn btn-outline-danger decline-btn" (click)="reviewFriendRequest('rejected', request._id)">

            ✖ Decline

          </button>

      

        </div>  

      </article>

    </div>

  </div>

</div>
