<div class="profile-container">

  <!-- EDIT PROFILE CARD -->
  <div class="card" *ngIf="isEditing">
    <h2>Edit Profile ✨</h2>

    <form [formGroup]="editProfileForm" (ngSubmit)="onSubmit()">

      <div class="image-upload">
        <input type="file" id="image" hidden />
        <label for="image" class="upload-btn">Upload Photo 📸</label>
      </div>

      <div class="form-group">
        <input type="text" formControlName="firstName" placeholder="First Name" />
        <input type="text" formControlName="lastName" placeholder="Last Name" />
      </div>

      <div class="form-group">
        <input type="number" formControlName="age" placeholder="Age" />
        <input type="text" formControlName="gender" placeholder="Gender" />
      </div>

      <div class="form-group">
        <input type="text" formControlName="skills" placeholder="Skills (comma separated)" />
      </div>

      <button type="submit" class="save-btn">Save Changes 💾</button>
      <button type="button" class="cancel-btn" (click)="cancelEdit()">Cancel ❌</button>
    </form>
  </div>


  <!-- VIEW PROFILE CARD -->
  <div class="card profile-card" *ngIf="!isEditing">

    <div class="profile-img">
      <img src="{{ userProfile.image }}" alt="profile" />
    </div>

    <h2>{{ userProfile.firstName }} {{ userProfile.lastName }}</h2>
    <p class="tagline">{{ userProfile.age }} • {{ userProfile.gender }}</p>

    <div class="skills">
<span *ngFor="let skill of userProfile.skills">
  {{ skill }}
</span>
    </div>

    <button class="edit-btn" (click)="enableEdit()">Edit Profile ✏️</button>

  </div>

</div>
