<div class="profile-shell">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card cute-card border-0">
          <div class="card-body p-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div>
                <p class="badge cute-badge mb-2">Edit Profile</p>
                <h4 class="mb-0">Your cute card</h4>
              </div>
              <i class="fa fa-star header-icon"></i>
            </div>

            <form [formGroup]="editProfile" (ngSubmit)="onSubmit()">
              <div class="image-row mb-4">
                <div class="image-frame">
                  <img
                    [src]="imagePreview || editProfile.get('image')?.value || 'data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"140\" height=\"140\"><rect width=\"140\" height=\"140\" fill=\"%23f1f5ff\"/><circle cx=\"70\" cy=\"58\" r=\"26\" fill=\"%23c7d7ff\"/><rect x=\"28\" y=\"92\" width=\"84\" height=\"32\" rx=\"16\" fill=\"%23c7d7ff\"/></svg>'"
                    alt="Profile preview"
                  >
                </div>
                <div class="image-actions">
                  <label class="form-label mb-1">Profile photo</label>
                  <input type="file" class="form-control form-control-sm" accept="image/*" (change)="onImageSelected($event)">
                  <input type="url" class="form-control form-control-sm mt-2" placeholder="Or paste image URL" formControlName="image" (input)="imagePreview = editProfile.get('image')?.value">
                  <small class="text-danger" *ngIf="editProfile.get('image')?.touched && editProfile.get('image')?.invalid">
                    Provide a valid URL starting with http or https.
                  </small>
                </div>
              </div>

              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label">First Name</label>
                  <input type="text" class="form-control form-control-sm cute-input" placeholder="First name" formControlName="firstName">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label">Last Name</label>
                  <input type="text" class="form-control form-control-sm cute-input" placeholder="Last name" formControlName="lastName">
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label">Age</label>
                  <input type="number" class="form-control form-control-sm cute-input" placeholder="Age" formControlName="age" min="18" max="99">
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label">Gender</label>
                  <select class="form-select form-select-sm cute-input" formControlName="gender">
                    <option value="" disabled>Select</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="nonbinary">Non-binary</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="col-12 col-md-4">
                  <label class="form-label">Skills</label>
                  <input type="text" class="form-control form-control-sm cute-input" placeholder="e.g. Hiking, UX" formControlName="skills">
                </div>
                <div class="col-12">
                  <label class="form-label">About</label>
                  <textarea class="form-control form-control-sm cute-input" rows="3" placeholder="A short bio" formControlName="about"></textarea>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mt-4">
                <button type="button" class="btn btn-light btn-sm cute-btn">
                  <i class="fa fa-times me-1"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary btn-sm cute-btn-primary">
                  <i class="fa fa-save me-1"></i> Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
